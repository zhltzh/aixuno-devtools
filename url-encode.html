<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Encoder / Decoder — Aixuno Devtools</title>
    <meta name="description" content="Percent-encode and decode URLs, and inspect query parameters in a table. Free, local, no upload." />
    <link rel="canonical" href="https://devtools.aixuno.com/url-encode.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">🔗 <span data-i18n="t_url_name">URL Encoder</span></span>
        <h1><span data-i18n="url_h1">URL Encoder / Decoder</span> <span class="grad" data-i18n="url_h1_g">percent encoding</span></h1>
        <p class="lead" data-i18n="url_lead">Escape and unescape URLs, and inspect query parameters.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="card">
        <textarea id="io" placeholder="https://example.com/search?q=hello world&lang=zh"></textarea>
        <div class="btn-row">
          <button id="btn-enc" class="btn btn-primary" data-i18n="url_encode">Encode (component)</button>
          <button id="btn-uri" class="btn btn-secondary" data-i18n="url_encode_uri">Encode (full URL)</button>
          <button id="btn-dec" class="btn btn-secondary" data-i18n="url_decode">Decode</button>
          <button id="btn-clear" class="btn btn-ghost" data-i18n="url_clear">Clear</button>
        </div>
      </div>
      <div class="card" id="params-card" hidden>
        <h2 data-i18n="url_params">Query parameters</h2>
        <div class="result-list" id="params"></div>
      </div>
    </div>
    <script type="module" src="./src/app/url-encode.js"></script>
  </body>
</html>
