<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Generator — Aixuno Devtools</title>
    <meta name="description" content="Generate strong random passwords with custom character sets — cryptographically secure, local, free." />
    <link rel="canonical" href="https://devtools.aixuno.com/password.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">🔑 <span data-i18n="t_pw_name">Password</span></span>
        <h1><span data-i18n="pw_h1">Password Generator</span> <span class="grad" data-i18n="pw_h1_g">strong &amp; random</span></h1>
        <p class="lead" data-i18n="pw_lead">Cryptographically random passwords with the character sets you choose.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="card">
        <div class="result-item" style="padding: 14px">
          <code id="pw-out" style="font-size: 17px; font-weight: 700"></code>
        </div>
        <label class="field" style="margin-top: 16px"><span data-i18n="pw_length">Length</span>: <span id="len-val">16</span></label>
        <input type="range" id="len" min="6" max="64" value="16" />
        <div class="check-row">
          <label><input type="checkbox" id="c-lower" checked /><span data-i18n="pw_lower">lowercase a-z</span></label>
          <label><input type="checkbox" id="c-upper" checked /><span data-i18n="pw_upper">UPPERCASE A-Z</span></label>
          <label><input type="checkbox" id="c-digit" checked /><span data-i18n="pw_digits">digits 0-9</span></label>
          <label><input type="checkbox" id="c-symbol" checked /><span data-i18n="pw_symbols">symbols !@#…</span></label>
          <label><input type="checkbox" id="c-exclude" checked /><span data-i18n="pw_exclude">Exclude ambiguous (0O1lI)</span></label>
        </div>
        <div class="btn-row">
          <button id="btn-gen" class="btn btn-primary" data-i18n="pw_generate">Generate</button>
          <button id="btn-copy" class="btn btn-secondary" data-i18n="pw_copy">Copy</button>
        </div>
        <p id="pw-strength" style="margin: 12px 0 0; font-size: 14px; font-weight: 650"></p>
      </div>
    </div>
    <script type="module" src="./src/app/password.js"></script>
  </body>
</html>
