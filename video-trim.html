<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Trimmer — Aixuno Devtools</title>
    <meta name="description" content="Cut a segment out of any video without uploading — set start and duration, download the clip. Free, local." />
    <link rel="canonical" href="https://devtools.aixuno.com/video-trim.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </body>
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">✂️ <span data-i18n="t_vtrim_name">Video Trimmer</span></span>
        <h1><span data-i18n="vtrim_h1">Video Trimmer</span> <span class="grad" data-i18n="vtrim_h1_g">cut without re-encode</span></h1>
        <p class="lead" data-i18n="vtrim_lead">Cut out the part you need — stream copy keeps the original quality, no re-encoding.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="dropzone" id="dz" tabindex="0" role="button">
        <div class="dz-icon">✂️</div>
        <div class="dz-text" data-i18n="vtrim_drop">Drop a video here</div>
        <div class="dz-hint" data-i18n="vtrim_drop_hint">MP4 · WebM · MOV</div>
      </div>
      <div class="card" id="opts" hidden>
        <p style="margin: 0 0 12px; font-weight: 700" id="f-name"></p>
        <div style="display: flex; gap: 14px; flex-wrap: wrap">
          <label style="display: inline-flex; gap: 6px; align-items: center; font-size: 14px"><span data-i18n="vtrim_start">Start (s)</span><input type="number" id="start" min="0" step="0.5" value="0" style="width: 86px" /></label>
          <label style="display: inline-flex; gap: 6px; align-items: center; font-size: 14px"><span data-i18n="vtrim_dur">Duration (s)</span><input type="number" id="dur" min="0.5" step="0.5" value="5" style="width: 86px" /></label>
        </div>
        <div class="btn-row"><button id="btn-run" class="btn btn-primary" data-i18n="vtrim_go">Cut &amp; download</button></div>
        <div class="progress-track" id="pbar-wrap" hidden style="margin-top: 14px"><div class="progress-bar" id="pbar"></div></div>
        <p id="status" style="margin: 10px 0 0; font-size: 13.5px; color: var(--ink-soft)"></p>
      </div>
    </div>
    <script type="module" src="./src/app/video-trim.js"></script>
  </body>
</html>
