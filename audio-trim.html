<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Trimmer — Aixuno Devtools</title>
    <meta name="description" content="Cut a segment out of any audio file — stream copy keeps original quality. Free, local, no upload." />
    <link rel="canonical" href="https://devtools.aixuno.com/audio-trim.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">✂️ <span data-i18n="t_atrim_name">Audio Trimmer</span></span>
        <h1><span data-i18n="atrim_h1">Audio Trimmer</span> <span class="grad" data-i18n="atrim_h1_g">no re-encode</span></h1>
        <p class="lead" data-i18n="atrim_lead">Cut out the part you need — stream copy keeps original quality.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="dropzone" id="dz" tabindex="0" role="button">
        <div class="dz-icon">✂️</div>
        <div class="dz-text" data-i18n="atrim_drop">Drop an audio file here</div>
        <div class="dz-hint" data-i18n="atrim_drop_hint">MP3 · WAV · OGG · AAC · FLAC · M4A</div>
      </div>
      <div class="card" id="opts" hidden>
        <p style="margin: 0 0 12px; font-weight: 700" id="f-name"></p>
        <div style="display: flex; gap: 14px; flex-wrap: wrap">
          <label style="display: inline-flex; gap: 6px; align-items: center; font-size: 14px"><span data-i18n="atrim_start">Start (s)</span><input type="number" id="start" min="0" step="0.5" value="0" style="width: 86px" /></label>
          <label style="display: inline-flex; gap: 6px; align-items: center; font-size: 14px"><span data-i18n="atrim_dur">Duration (s)</span><input type="number" id="dur" min="0.5" step="0.5" value="10" style="width: 86px" /></label>
        </div>
        <div class="btn-row"><button id="btn-run" class="btn btn-primary" data-i18n="atrim_go">Cut &amp; download</button></div>
        <div class="progress-track" id="pbar-wrap" hidden style="margin-top: 14px"><div class="progress-bar" id="pbar"></div></div>
        <p id="status" style="margin: 10px 0 0; font-size: 13.5px; color: var(--ink-soft)"></p>
      </div>
    </div>
    <script type="module" src="./src/app/audio-trim.js"></script>
  </body>
</html>
