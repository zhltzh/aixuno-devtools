server {
    listen 80;
    server_name aizak.cn www.aizak.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aizak.cn www.aizak.cn;

    # 证书路径（certbot 会自动填充/续期，先用占位路径）
    ssl_certificate     /etc/letsencrypt/live/aizak.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aizak.cn/privkey.pem;

    root /var/www/aizak;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 不缓存（保证更新即时生效）
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
