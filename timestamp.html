<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timestamp Converter — Aixuno Devtools</title>
    <meta name="description" content="Convert Unix timestamps to dates and back — seconds/milliseconds, ISO 8601, UTC and relative time. Free, local, no upload." />
    <link rel="canonical" href="https://devtools.aixuno.com/timestamp.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">🕒 <span data-i18n="t_ts_name">Timestamp</span></span>
        <h1><span data-i18n="ts_h1">Timestamp Converter</span> <span class="grad" data-i18n="ts_h1_g">epoch ⇄ date</span></h1>
        <p class="lead" data-i18n="ts_lead">Convert Unix timestamps to human dates and back.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="card">
        <h2><span data-i18n="ts_now">Now</span> · <code id="clock" style="font-size: 15px;"></code></h2>
      </div>
      <div class="card">
        <h2 data-i18n="ts_to_date">Timestamp → Date</h2>
        <label class="field" data-i18n="ts_input_ts">Unix timestamp (s or ms)</label>
        <input type="text" id="in-ts" placeholder="1764043200 / 1764043200000" style="font-family: var(--mono)" />
        <div class="btn-row"><button id="btn-ts2date" class="btn btn-primary" data-i18n="ts_convert">Convert</button></div>
        <div class="result-list" id="ts-out" style="margin-top: 14px"></div>
      </div>
      <div class="card">
        <h2 data-i18n="ts_to_ts">Date → Timestamp</h2>
        <label class="field" data-i18n="ts_input_date">Date &amp; time</label>
        <input type="datetime-local" id="in-date" step="1" />
        <div class="btn-row"><button id="btn-date2ts" class="btn btn-primary" data-i18n="ts_convert">Convert</button></div>
        <div class="result-list" id="date-out" style="margin-top: 14px"></div>
      </div>
    </div>
    <script type="module" src="./src/app/timestamp.js"></script>
  </body>
</html>
