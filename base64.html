<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base64 Encoder / Decoder — Aixuno Devtools</title>
    <meta name="description" content="UTF-8 safe Base64 encode and decode for text, plus file-to-Base64. Runs locally, free, no upload." />
    <link rel="canonical" href="https://devtools.aixuno.com/base64.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">🔤 <span data-i18n="t_b64_name">Base64</span></span>
        <h1><span data-i18n="b64_h1">Base64 Encoder / Decoder</span> <span class="grad" data-i18n="b64_h1_g">text &amp; files</span></h1>
        <p class="lead" data-i18n="b64_lead">UTF-8 safe Base64 encode / decode, plus file-to-Base64.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="card">
        <textarea id="io" placeholder="Paste text or Base64…"></textarea>
        <div class="btn-row">
          <button id="btn-enc" class="btn btn-primary" data-i18n="b64_encode">Encode</button>
          <button id="btn-dec" class="btn btn-secondary" data-i18n="b64_decode">Decode</button>
          <button id="btn-swap" class="btn btn-ghost" data-i18n="b64_swap">Swap</button>
          <button id="btn-clear" class="btn btn-ghost" data-i18n="b64_clear">Clear</button>
        </div>
        <p id="b64-msg" style="margin: 10px 0 0; font-size: 13.5px;"></p>
      </div>
      <div class="card">
        <h2 data-i18n="b64_file">File → Base64</h2>
        <div class="dropzone" id="dz" tabindex="0" role="button">
          <div class="dz-icon">📄</div>
          <div class="dz-hint" data-i18n="b64_file_hint">file is read locally, never uploaded</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/app/base64.js"></script>
  </body>
</html>
