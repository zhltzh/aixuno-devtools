<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unit Converter — Aixuno Devtools</title>
    <meta name="description" content="Convert length, weight, temperature, area, data size and speed units — mm to inches, kg to pounds, °C to °F and more. Free, local." />
    <link rel="canonical" href="https://devtools.aixuno.com/unit-converter.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">📐 <span data-i18n="t_unit_name">Unit Converter</span></span>
        <h1><span data-i18n="unit_h1">Unit Converter</span> <span class="grad" data-i18n="unit_h1_g">everyday units</span></h1>
        <p class="lead" data-i18n="unit_lead">Length, weight, temperature, area, data and speed — instant conversion.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="card">
        <label class="field" data-i18n="unit_category">Category</label>
        <select id="cat"></select>
        <div style="display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 14px">
          <div>
            <label class="field" data-i18n="unit_from">From</label>
            <div style="display: flex; gap: 8px">
              <select id="from" style="width: 45%"></select>
              <input type="number" id="in-val" value="1" style="flex: 1" />
            </div>
          </div>
          <div>
            <label class="field" data-i18n="unit_to">To</label>
            <div style="display: flex; gap: 8px">
              <select id="to" style="width: 45%"></select>
              <input type="text" id="out-val" readonly style="flex: 1; font-family: var(--mono); font-weight: 700" />
            </div>
          </div>
        </div>
        <div class="btn-row"><button id="btn-swap" class="btn btn-secondary">⇄ <span data-i18n="unit_swap">Swap</span></button></div>
      </div>
    </div>
    <script type="module" src="./src/app/unit-converter.js"></script>
  </body>
</html>
