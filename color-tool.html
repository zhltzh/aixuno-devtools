<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Tool — Aixuno Devtools</title>
    <meta name="description" content="Convert colors between HEX, RGB and HSL, preview them, and generate lighten/darken variants. Free, local." />
    <link rel="canonical" href="https://devtools.aixuno.com/color-tool.html" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f6bff'/%3E%3Cpath fill='%23fff' d='m8 5 5 9.5L18 5h2.5L13 19h-1L5.5 5H8Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="page-head">
      <div class="wrap">
        <span class="eyebrow">🎨 <span data-i18n="t_color_name">Color Tool</span></span>
        <h1><span data-i18n="color_h1">Color Tool</span> <span class="grad" data-i18n="color_h1_g">HEX · RGB · HSL</span></h1>
        <p class="lead" data-i18n="color_lead">Pick a color, get every format plus shades and a complementary color.</p>
      </div>
    </div>
    <div class="wrap tool-body">
      <div class="card">
        <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap">
          <input type="color" id="picker" value="#2f6bff" style="width: 72px; height: 48px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: none" />
          <input type="text" id="hex" value="#2f6bff" style="width: 130px; font-family: var(--mono); font-weight: 700" />
          <div id="preview" style="width: 100%; height: 56px; border-radius: 10px; border: 1px solid var(--line)"></div>
        </div>
      </div>
      <div class="card">
        <h2 data-i18n="color_formats">Formats</h2>
        <div class="result-list" id="formats"></div>
      </div>
      <div class="card">
        <h2 data-i18n="color_shades">Shades &amp; complementary</h2>
        <div id="shades" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px"></div>
      </div>
    </div>
    <script type="module" src="./src/app/color-tool.js"></script>
  </body>
</html>
